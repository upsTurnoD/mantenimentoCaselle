<script>
    const SHEET_ID = '1_3E3TLIUcYghEogWHK-FrImUcMdc5rNOx_RJOoVqZa4';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

    const LIMITE_GIORNI = 90;
    const SOGLIA_ALERT = 10;

    function parseDateIT(dateStr) {
      if (!dateStr) return null;
      // Pulisce eventuali virgolette residue
      dateStr = dateStr.replace(/"/g, '').trim();
      const parts = dateStr.split('/');
      if (parts.length === 3) {
        // Restituisce la data con orario azzerato per un calcolo pulito dei giorni
        return new Date(parts[2], parts[1] - 1, parts[0]);
      }
      return new Date(dateStr);
    }

    async function caricaDati() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('Errore nella rete');

        const dataText = await response.text();
        const righe = parseCSV(dataText);
        
        let htmlTable = '';
        let personeInAlert = [];
        
        // Imposta la data di oggi a mezzanotte per un confronto preciso sui giorni
        const oggi = new Date();
        oggi.setHours(0, 0, 0, 0);

        for (let i = 1; i < righe.length; i++) {
          const nome = righe[i][0];
          const dataStr = righe[i][1];
          
          if (!nome || !dataStr) continue;

          const ultimaData = parseDateIT(dataStr);
          if (!ultimaData || isNaN(ultimaData)) continue;

          const diffTempo = oggi - ultimaData;
          const giorniTrascorsi = Math.floor(diffTempo / (1000 * 60 * 60 * 24));
          const giorniRimanenti = LIMITE_GIORNI - giorniTrascorsi;

          let statoBadge = '';
          if (giorniRimanenti <= 0) {
            statoBadge = `<span class="badge badge-danger">SCADUTO (${Math.abs(giorniRimanenti)} gg fa)</span>`;
            personeInAlert.push({ nome, giorniRimanenti });
          } else if (giorniRimanenti <= SOGLIA_ALERT) {
            statoBadge = `<span class="badge badge-warning">IN SCADENZA</span>`;
            personeInAlert.push({ nome, giorniRimanenti });
          } else {
            statoBadge = `<span class="badge badge-ok">OK</span>`;
          }

          htmlTable += `
            <tr>
              <td><strong>${nome}</strong></td>
              <td>${dataStr.replace(/"/g, '')}</td>
              <td>${giorniRimanenti} giorni</td>
              <td>${statoBadge}</td>
            </tr>
          `;
        }

        document.getElementById('tableBody').innerHTML = htmlTable || '<tr><td colspan="4">Nessun dato trovato.</td></tr>';
        mostraAlert(personeInAlert);

      } catch (error) {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="4">Errore nel caricamento dei dati. Assicurati che il foglio sia condiviso correttamente.</td></tr>';
      }
    }

    function mostraAlert(elenco) {
      const container = document.getElementById('alertsContainer');
      if (elenco.length === 0) {
        container.innerHTML = '';
        return;
      }

      let alertHTML = `<div class="alert-box"><h2>⚠️ Attenzione: Sostituzioni necessarie!</h2><ul>`;
      elenco.forEach(p => {
        if (p.giorniRimanenti <= 0) {
          alertHTML += `<li><strong>${p.nome}</strong>: Scaduto da ${Math.abs(p.giorniRimanenti)} giorni!</li>`;
        } else {
          alertHTML += `<li><strong>${p.nome}</strong>: Mancano solo ${p.giorniRimanenti} giorni alla scadenza.</li>`;
        }
      });
      alertHTML += `</ul></div>`;
      container.innerHTML = alertHTML;
    }

    // Parser CSV migliorato per gestire correttamente le virgole all'interno delle celle
    function parseCSV(text) {
      const lines = text.split('\n');
      return lines.map(line => {
        const row = [];
        let inQuotes = false;
        let entry = '';
        
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            row.iterrows ? null : row.push(entry.trim());
            entry = '';
            continue;
          }
          entry += char;
        }
        row.push(entry.trim());
        return row.map(cell => cell.replace(/^"(.*)"$/, '$1').trim());
      });
    }

    caricaDati();
  </script>
